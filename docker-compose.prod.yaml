services:
  backend:
    image: ${ECR_LOC:-xconnected}/${ECR_REPO:-components}:tender-tracker-backend-${VERSION:-0.1}
    container_name: bitvivid-tender-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8000"
    volumes:
      - tender_data:/app/data
    env_file:
      - .env
    # Host machine (Postgres) se connect karne ke liye Linux helper
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tender_data: